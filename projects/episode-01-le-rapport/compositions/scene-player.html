<!doctype html>
<html lang="fr">
<head>
  <meta charset="UTF-8" />
  <title>Mohamed Excel — Scene Direction System (SDS) Player</title>
  <script src="https://cdn.jsdelivr.net/npm/gsap@3.15.0/dist/gsap.min.js"></script>
  <style>
    :root {
      --color-excel-green: #107C41;
      --color-dark-slate: #1E293B;
      --font-primary: 'Segoe UI', system-ui, -apple-system, sans-serif;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      background: #0B0F19;
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      font-family: var(--font-primary);
      color: #F8FAFC;
    }

    #stage-viewport {
      position: relative;
      width: 1080px;
      height: 1920px;
      background: #F8FAFC;
      overflow: hidden;
      box-shadow: 0 25px 60px rgba(0, 0, 0, 0.6);
    }

    #root {
      position: absolute;
      inset: 0;
      width: 1080px;
      height: 1920px;
      overflow: hidden;
    }

    /* Director HUD Overlay */
    #director-hud {
      position: absolute;
      top: 40px;
      left: 40px;
      right: 40px;
      z-index: 100;
      display: flex;
      justify-content: space-between;
      align-items: center;
      background: rgba(15, 23, 42, 0.88);
      border: 1.5px solid #334155;
      backdrop-filter: blur(12px);
      padding: 14px 24px;
      border-radius: 999px;
      box-shadow: 0 10px 25px rgba(0, 0, 0, 0.3);
      pointer-events: auto;
    }

    .hud-title-wrap {
      display: flex;
      align-items: center;
      gap: 12px;
    }

    .hud-dot {
      width: 12px;
      height: 12px;
      border-radius: 50%;
      background: #107C41;
      box-shadow: 0 0 10px #107C41;
    }

    .hud-title {
      font-size: 16px;
      font-weight: 800;
      letter-spacing: -0.2px;
      color: #FFFFFF;
    }

    .hud-badge {
      font-size: 11px;
      font-weight: 800;
      background: #1E293B;
      color: #38BDF8;
      padding: 3px 10px;
      border-radius: 999px;
      border: 1px solid #334155;
      text-transform: uppercase;
      letter-spacing: 0.5px;
    }

    .hud-controls {
      display: flex;
      align-items: center;
      gap: 12px;
    }

    .hud-btn {
      background: #1E293B;
      border: 1px solid #334155;
      color: #F1F5F9;
      font-size: 13px;
      font-weight: 700;
      padding: 6px 14px;
      border-radius: 8px;
      cursor: pointer;
      text-decoration: none;
    }

    .hud-btn:hover {
      background: #334155;
      color: #FFFFFF;
    }

    .hud-btn.active {
      background: #107C41;
      border-color: #107C41;
      color: #FFFFFF;
    }

    #loading-indicator {
      position: absolute;
      inset: 0;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      background: #0B0F19;
      z-index: 50;
      font-size: 18px;
      font-weight: 700;
      color: #94A3B8;
      gap: 16px;
    }

    .spinner {
      width: 44px;
      height: 44px;
      border: 4px solid #1E293B;
      border-top-color: #107C41;
      border-radius: 50%;
      animation: spin 0.8s linear infinite;
    }

    @keyframes spin {
      to { transform: rotate(360deg); }
    }
  </style>
</head>
<body>
  <div id="stage-viewport" data-composition-id="scene-player" data-width="1080" data-height="1920">
    <!-- Director HUD -->
    <div id="director-hud" data-layout-ignore="true">
      <div class="hud-title-wrap">
        <span class="hud-dot"></span>
        <span id="scene-label" class="hud-title">SDS SCENE PLAYER</span>
        <span id="version-badge" class="hud-badge">SDS v2.2.0</span>
      </div>
      <div class="hud-controls">
        <a id="btn-scene-1" href="?scene=benchmark-interaction.json" class="hud-btn">Bench 1: Interaction</a>
        <a id="btn-scene-2" href="?scene=benchmark-second-scene.json" class="hud-btn">Bench 2: Coffee Talk</a>
        <a id="btn-scene-3" href="?scene=benchmark-cup-pickup.json" class="hud-btn">Bench 3: Cup Pick-Up</a>
        <a id="btn-scene-4" href="?scene=benchmark-object-motion.json" class="hud-btn">Bench 4: Object Motion</a>
        <a id="btn-scene-5" href="?scene=benchmark-cinematic-camera.json" class="hud-btn">Bench 5: Cinematic Camera</a>
      </div>
    </div>

    <!-- Active Stage Root -->
    <div id="root" data-layout-allow-overflow="true"></div>

    <!-- Loading State -->
    <div id="loading-indicator">
      <div class="spinner"></div>
      <span id="loading-msg">Compiling Declarative Scene Specification...</span>
    </div>
  </div>

  <script type="module">
    import { SceneCompiler } from '../lib/sds/scene-compiler.js';

    async function init() {
      const urlParams = new URLSearchParams(window.location.search);
      const sceneFile = urlParams.get('scene') || 'benchmark-interaction.json';
      const scenePath = `../benchmarks/${sceneFile}`;

      // Update HUD active state
      if (sceneFile.includes('second-scene')) {
        document.getElementById('btn-scene-2')?.classList.add('active');
      } else if (sceneFile.includes('cup-pickup')) {
        document.getElementById('btn-scene-3')?.classList.add('active');
      } else if (sceneFile.includes('object-motion')) {
        document.getElementById('btn-scene-4')?.classList.add('active');
      } else if (sceneFile.includes('cinematic-camera')) {
        document.getElementById('btn-scene-5')?.classList.add('active');
      } else {
        document.getElementById('btn-scene-1')?.classList.add('active');
      }

      try {
        const response = await fetch(scenePath);
        if (!response.ok) {
          throw new Error(`Failed to load scene specification: ${scenePath} (HTTP ${response.status})`);
        }
        const spec = await response.json();

        document.getElementById('scene-label').textContent = spec.metadata.title;

        // Compile scene directly to GSAP timeline
        const compiler = new SceneCompiler({ strict: true });
        const result = compiler.compile(spec, '#root');

        // Hide loading indicator
        document.getElementById('loading-indicator').style.display = 'none';

        // Expose timeline to window.__timelines for HyperFrames runtime
        window.__timelines = window.__timelines || {};
        window.__timelines['scene-player'] = result.timeline;
        window.__compiledScene = {
          spec,
          result
        };

        console.log(`[SDS ScenePlayer] Compiled scene "${spec.metadata.id}" successfully with ${spec.events.length} events.`);
      } catch (err) {
        console.error('[SDS ScenePlayer Error]', err);
        document.getElementById('loading-msg').innerHTML = `
          <div style="color: #EF4444; text-align: center; max-width: 800px; line-height: 1.5;">
            <div style="font-size: 22px; margin-bottom: 8px;">Scene Compilation Error</div>
            <pre style="font-family: monospace; font-size: 13px; text-align: left; background: #1E293B; padding: 16px; border-radius: 8px; white-space: pre-wrap;">${err.message}</pre>
          </div>
        `;
      }
    }

    init();
  </script>
</body>
</html>
