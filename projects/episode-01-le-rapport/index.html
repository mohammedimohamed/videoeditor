<!doctype html>
<html lang="fr" data-resolution="portrait">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=1080, height=1920" />
    <title>Mohamed Excel — 2D Character Animation System (Pilot Episode 01 Prototype)</title>
    <script src="https://cdn.jsdelivr.net/npm/gsap@3.15.0/dist/gsap.min.js"></script>
    <style>
      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
      }

      html, body {
        width: 1080px;
        height: 1920px;
        overflow: hidden;
        background: #F8FAFC;
        font-family: 'Segoe UI', system-ui, -apple-system, sans-serif;
      }

      #root {
        position: relative;
        width: 1080px;
        height: 1920px;
        overflow: hidden;
        background: #F8FAFC;
      }
    </style>
  </head>
  <body>
    <div
      id="root"
      data-composition-id="main"
      data-start="0"
      data-duration="8.8"
      data-width="1080"
      data-height="1920"
      data-fps="30"
    >
      <!-- Sub-Composition: Primary Character Interaction Benchmark -->
      <div
        id="prototype"
        class="clip"
        data-composition-id="prototype"
        data-composition-src="compositions/prototype.html"
        data-hold
        data-start="0"
        data-duration="8.8"
        data-track-index="1"
        data-track-kind="graphics"
        data-width="1080"
        data-height="1920"
      ></div>
    </div>

    <script>
      window.__timelines = window.__timelines || {};
      window.__timelines["main"] = gsap.timeline({ paused: true });
    </script>
  </body>
</html>
